[package]
name = "shrapwill-updater"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23"
flate2 = "1"
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
url = "2"

[dev-dependencies]
tempfile = "3"
