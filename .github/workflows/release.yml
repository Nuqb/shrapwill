name: Publish Windows release updates
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v1.2.3)
        required: true
permissions:
  contents: write
concurrency:
  group: shrapwill-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.assets.outputs.needs_build }}
    steps:
      - name: Keep already published release assets unchanged
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          if (!/^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) throw Error('A stable version tag is required.');
          const version = tag.replace(/^v/, '');
          async function check() {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${tag}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
            });
            if (!response.ok && response.status !== 404) throw Error(`Release check failed: ${response.status}`);
            const release = response.ok ? await response.json() : { assets: [] };
            const uploaded = new Set(release.assets.filter(asset => asset.state === 'uploaded' && asset.size > 0).map(asset => asset.name));
            const required = [`Shrapwill_${version}_x64-setup.exe`, `Shrapwill_${version}_portable.zip`, `Shrapwill_${version}_windows-x86_64.shrapwill.gz`, 'shrapwill-update.json'];
            const complete = required.every(name => uploaded.has(name));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `needs_build=${!complete}\n`);
            console.log(complete ? 'Release assets are already complete; preserving published binaries.' : 'Release assets need to be built.');
          }
          check().catch(error => { console.error(error.message); process.exitCode = 1; });
  windows:
    needs: inspect
    if: needs.inspect.outputs.needs_build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Source
        shell: pwsh
    env:
      SHRAPWILL_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SHRAPWILL_RELEASE_NOTES: ${{ github.event.release.body }}
      SHRAPWILL_UPDATE_PRIVATE_KEY: ${{ secrets.SHRAPWILL_UPDATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Source/package-lock.json
      - name: Install build dependencies
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci
      - name: Verify release signing configuration
        run: node --input-type=module -e "import {signingKey} from './scripts/release/update-key.mjs'; signingKey(); console.log('Signing key verified.');"
      - name: Set version from stable tag
        run: node scripts/release/set-version.mjs
      - name: Test application
        run: npm test
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build installer
        run: npm run tauri -- build
      - name: Test update packaging and Windows handoff
        run: npm run test:updates
      - name: Test update screens and save prompts
        run: npm run test:updates-ui
      - name: Prepare signed update packages
        run: node scripts/prepare-update-release.mjs
      - name: Publish assets and then signed update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/upload-github.mjs
